    <rect width="1200" height="320" fill="url(#grid)"/>
    <circle cx="1042" cy="140" r="186" fill="#74E4D1" opacity="0.055"/>
    <circle cx="1110" cy="244" r="160" fill="#A19AFF" opacity="0.055"/>
    <path d="M 0 280 H 520" stroke="url(#accent)" stroke-width="4" opacity="0.8"/>

    <g font-family="Arial, Helvetica, sans-serif">
      <text x="64" y="70" fill="#8DE2D6" font-size="17" font-weight="700" letter-spacing="4">HELLO, I'M</text>
      <text x="60" y="145" fill="#F6F9FF" font-size="57" font-weight="700">Sutthiphong</text>
      <text x="63" y="195" fill="#C4CFE0" font-size="30" font-weight="400">Phongkumsing <tspan fill="#8DE2D6">/ @safeJJ</tspan></text>
      <text x="64" y="246" fill="#A9B9CD" font-size="18" letter-spacing="1">BUILDING PRACTICAL SOFTWARE FOR REAL WORK</text>
    </g>

