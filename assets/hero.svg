<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Sutthiphong Phongkumsing, safeJJ</title>
  <desc id="desc">Dark navy profile banner with teal and violet accents and a network pattern.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1221"/>
      <stop offset="0.55" stop-color="#14233D"/>
      <stop offset="1" stop-color="#102C36"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#78E9D2"/>
      <stop offset="1" stop-color="#9B9BFF"/>
