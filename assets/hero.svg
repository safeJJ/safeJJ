    <g fill="#9AECE0">
      <circle cx="825" cy="117" r="7"/><circle cx="910" cy="67" r="7"/>
      <circle cx="1017" cy="116" r="7"/><circle cx="1095" cy="77" r="7"/>
      <circle cx="876" cy="213" r="7"/><circle cx="989" cy="226" r="7"/>
      <circle cx="1087" cy="171" r="7"/><circle cx="1150" cy="225" r="7"/>
