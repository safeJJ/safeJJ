      <path d="M 825 117 L 910 67 L 1017 116 L 1095 77"/>
      <path d="M 825 117 L 876 213 L 989 226 L 1087 171 L 1017 116"/>
      <path d="M 910 67 L 989 226" opacity="0.38"/>
      <path d="M 1095 77 L 1087 171 L 1150 225" opacity="0.48"/>
