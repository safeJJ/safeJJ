<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="title desc">
  <title id="title">Travel Book concept</title>
  <desc id="desc">Illustrated travel scrapbook concept with a route, destination pins, and photo cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16283A"/>
      <stop offset="1" stop-color="#39345B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#96CFFF"/>
      <stop offset="1" stop-color="#D9ACFF"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#FFFFFF" stroke-opacity=".045"/>
    </pattern>
    <clipPath id="frame"><rect width="1000" height="260" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#frame)" font-family="Arial, Helvetica, sans-serif">
    <rect width="1000" height="260" fill="url(#bg)"/>
    <rect width="1000" height="260" fill="url(#grid)"/>
    <circle cx="858" cy="119" r="205" fill="#B9A6FF" opacity=".075"/>
    <rect x="0" y="0" width="7" height="260" fill="url(#accent)"/>

    <text x="42" y="54" fill="#C8B7FF" font-size="15" font-weight="700" letter-spacing="3">03 / TRAVEL CONCEPT</text>
    <text x="39" y="117" fill="#F9F9FF" font-size="48" font-weight="700">Travel Book</text>
    <text x="42" y="151" fill="#C9C8E0" font-size="19">Plan together. Keep the moments.</text>
    <g font-size="14" font-weight="700">
      <rect x="42" y="187" width="107" height="31" rx="15" fill="#494665" stroke="#BBA8F4" stroke-opacity=".52"/>
      <text x="61" y="208" fill="#E1D0FF">Prototype</text>
      <rect x="159" y="187" width="126" height="31" rx="15" fill="#494665" stroke="#BBA8F4" stroke-opacity=".52"/>
      <text x="178" y="208" fill="#E1D0FF">Mobile-first</text>
    </g>

    <rect x="585" y="27" width="373" height="206" rx="15" fill="#202B43" stroke="#B4ABF4" stroke-opacity=".36"/>
    <circle cx="607" cy="50" r="4" fill="#B9A9FF"/>
    <circle cx="622" cy="50" r="4" fill="#7584A4"/>
    <circle cx="637" cy="50" r="4" fill="#7584A4"/>
    <text x="657" y="55" fill="#C4C9DB" font-size="12" letter-spacing="1">TRIP SCRAPBOOK</text>
    <path d="M585 67H958" stroke="#586785" stroke-opacity=".6"/>

    <path d="M640 182C690 148 672 91 738 109S803 191 900 105" fill="none" stroke="#9FCBFF" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 7"/>
    <g fill="#C9B1FF" stroke="#27344E" stroke-width="4"><circle cx="641" cy="181" r="11"/><circle cx="740" cy="109" r="11"/><circle cx="901" cy="105" r="11"/></g>
    <g fill="#F8F5FF"><circle cx="641" cy="181" r="3"/><circle cx="740" cy="109" r="3"/><circle cx="901" cy="105" r="3"/></g>

    <g transform="rotate(-10 782 175)">
      <rect x="756" y="137" width="57" height="68" rx="4" fill="#EEEAF7"/>
      <rect x="762" y="143" width="45" height="45" rx="2" fill="#729BB5"/>
      <path d="M762 178L777 159L790 173L798 164L807 178Z" fill="#BCD4C8"/>
    </g>
    <g transform="rotate(10 852 169)">
      <rect x="827" y="130" width="57" height="68" rx="4" fill="#EEEAF7"/>
      <rect x="833" y="136" width="45" height="45" rx="2" fill="#9A8DBE"/>
      <circle cx="868" cy="146" r="6" fill="#F6D8A7"/>
      <path d="M833 177L847 160L858 171L869 157L878 177Z" fill="#C4C3DB"/>
    </g>
    <text x="605" y="212" fill="#B7C5D8" font-size="11" letter-spacing="1">PLAN  ·  VOTE  ·  REMEMBER</text>
  </g>
