<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="title desc">
  <title id="title">Carbon Ledger</title>
  <desc id="desc">Illustrated carbon accounting card with a Scope 1 to 3 emissions dashboard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102923"/>
      <stop offset="1" stop-color="#21533B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B9EEA9"/>
      <stop offset="1" stop-color="#65DCC1"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#FFFFFF" stroke-opacity=".04"/>
    </pattern>
    <clipPath id="frame"><rect width="1000" height="260" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#frame)" font-family="Arial, Helvetica, sans-serif">
    <rect width="1000" height="260" fill="url(#bg)"/>
    <rect width="1000" height="260" fill="url(#grid)"/>
    <circle cx="860" cy="125" r="205" fill="#B5EEA8" opacity=".065"/>
    <rect width="7" height="260" fill="url(#accent)"/>

    <text x="42" y="54" fill="#B9EEA9" font-size="15" font-weight="700" letter-spacing="3">03 / SUSTAINABILITY</text>
    <text x="39" y="117" fill="#F7FFF5" font-size="48" font-weight="700">Carbon Ledger</text>
    <text x="42" y="151" fill="#C4DFC9" font-size="19">Track emissions. Understand your footprint.</text>
    <g font-size="14" font-weight="700">
      <rect x="42" y="187" width="89" height="31" rx="15" fill="#2A5941" stroke="#B4E9A8" stroke-opacity=".46"/>
      <text x="58" y="208" fill="#DAF7CD">Next.js</text>
      <rect x="141" y="187" width="111" height="31" rx="15" fill="#2A5941" stroke="#B4E9A8" stroke-opacity=".46"/>
      <text x="158" y="208" fill="#DAF7CD">TypeScript</text>
      <rect x="262" y="187" width="103" height="31" rx="15" fill="#2A5941" stroke="#B4E9A8" stroke-opacity=".46"/>
      <text x="280" y="208" fill="#DAF7CD">Supabase</text>
    </g>

    <rect x="585" y="27" width="373" height="206" rx="15" fill="#10251E" stroke="#A5DF9F" stroke-opacity=".4"/>
    <circle cx="607" cy="50" r="4" fill="#B7EDA7"/>
    <circle cx="622" cy="50" r="4" fill="#638879"/>
    <circle cx="637" cy="50" r="4" fill="#638879"/>
    <text x="657" y="55" fill="#AAC8AE" font-size="12" letter-spacing="1">EMISSIONS OVERVIEW</text>
    <path d="M585 67H958" stroke="#52715A" stroke-opacity=".55"/>

    <g font-size="12">
      <text x="607" y="106" fill="#C7DDC7">SCOPE 1</text>
      <text x="607" y="144" fill="#C7DDC7">SCOPE 2</text>
      <text x="607" y="182" fill="#C7DDC7">SCOPE 3</text>
      <rect x="682" y="94" width="238" height="16" rx="8" fill="#264436"/>
      <rect x="682" y="132" width="238" height="16" rx="8" fill="#264436"/>
      <rect x="682" y="170" width="238" height="16" rx="8" fill="#264436"/>
      <rect x="682" y="94" width="152" height="16" rx="8" fill="#ACE99F"/>
      <rect x="682" y="132" width="107" height="16" rx="8" fill="#7CD8B6"/>
      <rect x="682" y="170" width="194" height="16" rx="8" fill="#66BCA7"/>
      <text x="607" y="214" fill="#8DB8A0" font-size="11" letter-spacing="1">CARBON FOOTPRINT OF ORGANIZATION</text>
    </g>
  </g>
</svg>
